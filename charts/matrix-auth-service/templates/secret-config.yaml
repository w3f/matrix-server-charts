apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
type: Opaque
data:
  rsa.pem: {{ .Values.secrets.keys.rsa | quote }}
  p256.pem: {{ .Values.secrets.keys.p256 | quote }}
  p384.pem: {{ .Values.secrets.keys.p384 | quote }}
  k256.pem: {{ .Values.secrets.keys.k256 | quote }}
stringData:
  config.yaml: |
    http:
      public_base: "https://{{ .Values.host }}/"
      issuer: "https://{{ .Values.host }}/"
      trusted_proxies: {{ toJson .Values.trustedProxies }}
      listeners:
        - name: web
          resources:
            - name: discovery
            - name: human
            - name: oauth
            - name: compat
            - name: graphql
            - name: assets
          binds:
            - address: "[::]:8080"
          proxy_protocol: false
        - name: internal
          resources:
            - name: health
          binds:
            - address: "[::]:8081"
          proxy_protocol: false

    database:
      uri: "postgresql://{{ .Values.db.user }}:{{ .Values.db.password }}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}"
      max_connections: 10

    matrix:
      kind: synapse
      homeserver: {{ .Values.domain | quote }}
      endpoint: {{ .Values.synapseEndpoint | quote }}
      secret: {{ .Values.secrets.synapseShared | quote }}

    secrets:
      encryption: {{ .Values.secrets.encryption | quote }}
      keys:
        - key_file: /config/rsa.pem
        - key_file: /config/p256.pem
        - key_file: /config/p384.pem
        - key_file: /config/k256.pem

    passwords:
      enabled: true
      schemes:
        - version: 1
          algorithm: bcrypt
          unicode_normalization: true
        - version: 2
          algorithm: argon2id
      minimum_complexity: 3

    account:
      password_registration_enabled: {{ .Values.passwordRegistration }}

{{- if .Values.captcha.enabled }}

    captcha:
      service: recaptcha_v2
      site_key: {{ .Values.captcha.siteKey | quote }}
      secret_key: {{ .Values.captcha.secretKey | quote }}
{{- end }}

{{- if .Values.email.enabled }}

    email:
      from: {{ .Values.email.from | quote }}
      reply_to: {{ .Values.email.from | quote }}
      transport: smtp
      mode: starttls
      hostname: {{ .Values.email.host | quote }}
      port: {{ .Values.email.port }}
      username: {{ .Values.email.user | quote }}
      password: {{ .Values.email.pass | quote }}
{{- end }}

{{- if .Values.google.enabled }}

    upstream_oauth2:
      providers:
        - id: {{ .Values.google.providerId | quote }}
          synapse_idp_id: {{ .Values.google.synapseIdpId | quote }}
          human_name: Google
          brand_name: google
          issuer: "https://accounts.google.com"
          client_id: {{ .Values.google.clientId | quote }}
          client_secret: {{ .Values.google.clientSecret | quote }}
          token_endpoint_auth_method: client_secret_basic
          scope: "openid profile email"
          fetch_userinfo: true
          claims_imports:
            localpart:
              action: require
              template: "{{`{{ user.email.split('@')[0] | lower }}`}}"
            displayname:
              action: force
              template: {{ .Values.google.displayNameTemplate | quote }}
            email:
              action: require
              template: "{{`{{ user.email }}`}}"
              set_email_verification: import
{{- end }}
